<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - BOLD Technology</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div class="dashboard-layout">
        <!-- Barre latérale -->
        <aside class="sidebar">
            <h3>BOLD Admin</h3>
            <nav>
                <button class="active">Actualités</button>
                <button id="btnLogout" class="btn-danger" style="margin-top: 3rem;">Déconnexion</button>
            </nav>
        </aside>

        <!-- Contenu principal -->
        <main class="main-content">
            <div class="header-actions">
                <h1>Gestion des Actualités</h1>
            </div>

            <!-- Formulaire d'ajout -->
            <div class="card">
                <h2>Ajouter une Actualité</h2>
                <form id="actualiteForm">
                    <div class="form-group">
                        <label for="titre">Titre</label>
                        <input type="text" id="titre" required placeholder="Titre de l'actualité">
                    </div>

                    <div class="form-group">
                        <label for="contenu">Contenu</label>
                        <textarea id="contenu" rows="4" required placeholder="Rédigez l'article..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="date_publication">Date de publication</label>
                        <input type="date" id="date_publication" required>
                    </div>

                    <div class="form-group">
                        <label for="image">Image d'illustration</label>
                        <input type="file" id="image" accept="image/*">
                    </div>

                    <button type="submit">Publier l'actualité</button>
                    <p id="formMessage"></p>
                </form>
            </div>

            <!-- Liste des articles -->
            <div class="card">
                <h2>Actualités existantes</h2>
                <div id="actualitesList">
                    <p>Chargement des actualités...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
